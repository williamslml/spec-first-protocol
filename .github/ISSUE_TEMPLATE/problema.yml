name: Reportar un problema
description: Algo no funciona como debería o la documentación es confusa.
labels: ["problema"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Si el problema es de seguridad, no uses este formulario: sigue lo que indica la política de seguridad del repositorio.
  - type: textarea
    id: que-ocurrio
    attributes:
      label: Qué ocurrió
      description: Describe el problema con tus palabras, sin jerga.
    validations:
      required: true
  - type: textarea
    id: que-esperaba
    attributes:
      label: Qué esperabas que ocurriera
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Los pasos concretos, en orden, o el comando que ejecutaste.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: asistente
    attributes:
      label: Asistente que usas
      options:
        - Claude Code
        - Cursor
        - GitHub Copilot
        - Gemini CLI
        - OpenCode
        - Windsurf
        - Codex
        - Otro
        - Ninguno, solo ejecuté los scripts
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Sistema operativo y terminal
      description: Por ejemplo, Windows 11 con Git Bash, o Ubuntu 24.04.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de la skill
      description: La que indica la insignia del README.
      placeholder: "1.16.2"
    validations:
      required: true
